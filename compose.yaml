name: go-node-throughput
x-app: &app
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY:-512m}
  init: true
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-env
    DATABASE_URL: postgres://bench:bench@postgres:5432/bench?sslmode=disable
    DB_POOL_SIZE: ${DB_POOL_SIZE:-32}
    PORT: "8080"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
    interval: 3s
    timeout: 3s
    retries: 20
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "2"
services:
  postgres:
    image: postgres:17-alpine
    cpus: ${DB_CPUS:-4}
    mem_limit: ${DB_MEMORY:-3g}
    shm_size: 1g
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench && psql -U bench -d bench -tAc 'SELECT ready FROM benchmark_meta WHERE id = 1' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 180
      start_period: 20s
  go-api:
    <<: *app
    build:
      context: .
      dockerfile: go-api/Dockerfile
    environment:
      <<: *app-env
      GOMAXPROCS: ${GO_MAX_PROCS:-2}
      GOMEMLIMIT: 400MiB
    ports: ["127.0.0.1:8081:8080"]
  node-api:
    <<: *app
    build:
      context: .
      dockerfile: node-api/Dockerfile
    environment:
      <<: *app-env
      NODE_WORKERS: ${NODE_WORKERS:-2}
      NODE_OPTIONS: --max-old-space-size=160
    ports: ["127.0.0.1:8082:8080"]
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: ${LOAD_CPUS:-8}
    mem_limit: ${LOAD_MEMORY:-1g}
    user: "0:0"
    volumes:
      - ./benchmark:/scripts:ro
      - ./results:/results
volumes:
  postgres-data:
